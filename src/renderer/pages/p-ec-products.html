<!-- E-Commerce Products -->
<div class="page-hd">
  <div>
    <h1 class="page-tt">🛍️ المنتجات</h1>
    <p class="page-st" id="ec-prod-count">—</p>
  </div>
  <div class="flex gap8">
    <input id="ec-prod-search" class="inp" placeholder="بحث..." style="width:200px" oninput="ecProdLoad()">
    <select id="ec-prod-cat" class="inp" style="width:160px" onchange="ecProdLoad()">
      <option value="">جميع الفئات</option>
    </select>
    <button class="btn bp" onclick="ecProdOpenForm()">+ منتج جديد</button>
  </div>
</div>

<div class="card">
  <div id="ec-prod-table"><div class="ta ts f12 py20">جارٍ التحميل...</div></div>
</div>

<!-- Product Form Modal -->
<div class="modal" id="m-ec-prod" style="display:none">
  <div class="modal-box" style="max-width:680px">
    <div class="modal-hd"><span id="ec-prod-form-title">منتج جديد</span><button class="btn-x" onclick="closeM('m-ec-prod')">×</button></div>
    <div class="modal-body">
      <input type="hidden" id="ec-prod-id">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="span2"><label class="lbl">اسم المنتج *</label><input id="ec-prod-name" class="inp w100" placeholder="اسم المنتج"></div>
        <div><label class="lbl">السعر (ج.م) *</label><input id="ec-prod-price" class="inp w100" type="number" min="0" step="0.01" placeholder="0.00"></div>
        <div><label class="lbl">سعر المقارنة</label><input id="ec-prod-compare" class="inp w100" type="number" min="0" step="0.01" placeholder="0.00"></div>
        <div><label class="lbl">الكمية</label><input id="ec-prod-stock" class="inp w100" type="number" min="0" placeholder="0"></div>
        <div><label class="lbl">حد المخزون المنخفض</label><input id="ec-prod-threshold" class="inp w100" type="number" min="0" placeholder="5"></div>
        <div><label class="lbl">الفئة</label>
          <select id="ec-prod-cat-sel" class="inp w100"><option value="">بدون فئة</option></select>
        </div>
        <div class="flex ic gap8 mt8 span2">
          <input type="checkbox" id="ec-prod-active" checked>
          <label for="ec-prod-active">منتج نشط</label>
          <span style="margin-right:16px"></span>
          <input type="checkbox" id="ec-prod-featured">
          <label for="ec-prod-featured">منتج مميز</label>
        </div>
        <div class="span2"><label class="lbl">الوصف</label><textarea id="ec-prod-desc" class="inp w100" rows="3" placeholder="وصف المنتج..."></textarea></div>
        <div class="span2"><label class="lbl">رابط الصورة</label><input id="ec-prod-img" class="inp w100" placeholder="https://..."></div>
        <div class="span2"><label class="lbl">الكلمات المفتاحية (مفصولة بفواصل)</label><input id="ec-prod-tags" class="inp w100" placeholder="قميص, ملابس, رجالي"></div>
      </div>
      <!-- Variants Section (shown only when editing existing product) -->
      <div id="ec-prod-variants-wrap" style="display:none;margin-top:16px;border-top:1px solid var(--bdr);padding-top:14px">
        <div class="flex jb ic mb10">
          <div class="fw7 f13">🔀 المتغيرات (مقاسات / ألوان...)</div>
          <button class="btn bp bsm" onclick="ecVariantOpenForm()">+ إضافة متغير</button>
        </div>
        <div id="ec-prod-variants-list" class="f12 ts ta">لا توجد متغيرات</div>
        <!-- Variant mini form -->
        <div id="ec-variant-form" style="display:none;background:var(--bg2);border-radius:8px;padding:12px;margin-top:10px">
          <input type="hidden" id="vr-id">
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">
            <div><label class="lbl f11">الاسم *</label><input id="vr-name" class="inp w100" placeholder="M / أحمر"></div>
            <div><label class="lbl f11">السعر (اتركه فارغاً للأساسي)</label><input id="vr-price" class="inp w100" type="number" min="0" step="0.01" placeholder="—"></div>
            <div><label class="lbl f11">المخزون</label><input id="vr-stock" class="inp w100" type="number" min="0" placeholder="0"></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
            <div><label class="lbl f11">SKU</label><input id="vr-sku" class="inp w100" placeholder="—"></div>
            <div><label class="lbl f11">الخصائص (JSON اختياري)</label><input id="vr-options" class="inp w100" placeholder='{"size":"M","color":"red"}'></div>
          </div>
          <div class="flex gap8">
            <button class="btn bp bsm" onclick="ecVariantSave()">حفظ المتغير</button>
            <button class="btn bo bsm" onclick="document.getElementById('ec-variant-form').style.display='none'">إلغاء</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-ft flex gap8 jb">
      <button class="btn bo" onclick="closeM('m-ec-prod')">إلغاء</button>
      <button class="btn bp" onclick="ecProdSave()">حفظ المنتج</button>
    </div>
  </div>
</div>

<script>
let _ecProdCats = [];

async function ecProdLoadCats() {
  const r = await BE.ec.categories.list();
  _ecProdCats = r.data || [];
  const makeOpts = (sel) => '<option value="">بدون فئة</option>' + _ecProdCats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  document.getElementById('ec-prod-cat-sel').innerHTML = makeOpts();
  document.getElementById('ec-prod-cat').innerHTML = '<option value="">جميع الفئات</option>' + _ecProdCats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
}

async function ecProdLoad() {
  if (!IS_ELECTRON) return;
  const search = document.getElementById('ec-prod-search').value.trim();
  const catId  = document.getElementById('ec-prod-cat').value;
  try {
    const r = await BE.ec.products.list({ search: search||undefined, category_id: catId||undefined });
    const prods = r.data || [];
    document.getElementById('ec-prod-count').textContent = `${prods.length} منتج`;
    if (!prods.length) { document.getElementById('ec-prod-table').innerHTML = '<div class="ta ts f12 py20">لا توجد منتجات</div>'; return; }
    document.getElementById('ec-prod-table').innerHTML = `<table class="tbl"><thead><tr><th>المنتج</th><th>الفئة</th><th>السعر</th><th>المخزون</th><th>الحالة</th><th></th></tr></thead><tbody>${prods.map(p=>`<tr><td><div class="fw7">${p.name}</div>${p.sku?`<div class="f11 ts fm">${p.sku}</div>`:''}</td><td class="f12 ts">${p.category_name||'—'}</td><td class="fw7">${(p.price||0).toFixed(2)} ج.م</td><td class="${p.stock_quantity<=(p.low_stock_threshold||5)?'fc-r fw7':''}">${p.stock_quantity??'—'}</td><td><span class="bge f11" style="background:${p.is_active?'#10b98120':'#6b728020'};color:${p.is_active?'#10b981':'#6b7280'}">${p.is_active?'نشط':'غير نشط'}</span></td><td class="flex gap4"><button class="btn bo bsm" onclick="ecProdOpenForm('${p.id}')">تعديل</button><button class="btn bsm" style="background:#ef444420;color:#ef4444" onclick="ecProdDelete('${p.id}','${p.name.replace(/'/g,'')}')">حذف</button></td></tr>`).join('')}</tbody></table>`;
  } catch(e) { console.error('[EC-Prods]', e); }
}

async function ecProdOpenForm(id) {
  await ecProdLoadCats();
  if (id) {
    const r = await BE.ec.products.get(id);
    if (!r.ok) { beErr(r.error); return; }
    const p = r.data;
    document.getElementById('ec-prod-form-title').textContent = 'تعديل المنتج';
    document.getElementById('ec-prod-id').value        = p.id;
    document.getElementById('ec-prod-name').value      = p.name||'';
    document.getElementById('ec-prod-price').value     = p.price||0;
    document.getElementById('ec-prod-compare').value   = p.compare_price||'';  // DB field: compare_price
    document.getElementById('ec-prod-stock').value     = p.stock_quantity||0;
    document.getElementById('ec-prod-threshold').value = p.low_stock_threshold||5;
    document.getElementById('ec-prod-cat-sel').value   = p.category_id||'';
    document.getElementById('ec-prod-active').checked  = !!p.is_active;
    document.getElementById('ec-prod-featured').checked= !!p.is_featured;
    document.getElementById('ec-prod-desc').value      = p.description||'';
    const imgs = (() => { try { return JSON.parse(p.images||'[]'); } catch(_) { return []; } })();
    document.getElementById('ec-prod-img').value       = imgs[0]?.url || p.image_url || '';
    const tags = (() => { try { return JSON.parse(p.tags||'[]'); } catch(_) { return []; } })();
    document.getElementById('ec-prod-tags').value      = tags.join(', ');
  } else {
    document.getElementById('ec-prod-form-title').textContent = 'منتج جديد';
    ['ec-prod-id','ec-prod-name','ec-prod-price','ec-prod-compare','ec-prod-stock','ec-prod-desc','ec-prod-img','ec-prod-tags'].forEach(i=>{ document.getElementById(i).value=''; });
    document.getElementById('ec-prod-threshold').value = 5;
    document.getElementById('ec-prod-active').checked  = true;
    document.getElementById('ec-prod-featured').checked= false;
    document.getElementById('ec-prod-cat-sel').value   = '';
    document.getElementById('ec-prod-variants-wrap').style.display = 'none';
    _ecVariantProdId = null; _ecVariants = [];
  }
  openM('m-ec-prod');
  if (id) await ecVariantLoadList(id);
}

// ── Variants ─────────────────────────────────────────────────────────────────
let _ecVariantProdId = null;
let _ecVariants = [];

async function ecVariantLoadList(productId) {
  _ecVariantProdId = productId;
  document.getElementById('ec-prod-variants-wrap').style.display = 'block';
  const r = await BE.ec.variants.list(productId);
  _ecVariants = (r.data || []);
  const listEl = document.getElementById('ec-prod-variants-list');
  if (!_ecVariants.length) { listEl.innerHTML = '<div class="ta ts f12 py8">لا توجد متغيرات بعد</div>'; return; }
  listEl.innerHTML = `<table class="tbl" style="font-size:11px"><thead><tr><th>الاسم</th><th>السعر</th><th>المخزون</th><th>SKU</th><th></th></tr></thead><tbody>
    ${_ecVariants.map(v=>`<tr><td class="fw7">${v.name}</td><td>${v.price!=null ? v.price+' ج.م' : '(أساسي)'}</td><td>${v.stock_quantity||0}</td><td class="ts">${v.sku||'—'}</td>
    <td class="flex gap4"><button class="btn bo bsm" onclick="ecVariantOpenForm('${v.id}')">تعديل</button><button class="btn bsm" style="background:#ef444420;color:#ef4444" onclick="ecVariantDelete('${v.id}')">حذف</button></td></tr>`).join('')}
  </tbody></table>`;
}

function ecVariantOpenForm(id) {
  const form = document.getElementById('ec-variant-form');
  form.style.display = 'block';
  if (id) {
    const v = _ecVariants.find(x => x.id === id);
    if (!v) return;
    document.getElementById('vr-id').value      = v.id;
    document.getElementById('vr-name').value    = v.name || '';
    document.getElementById('vr-price').value   = v.price != null ? v.price : '';
    document.getElementById('vr-stock').value   = v.stock_quantity || 0;
    document.getElementById('vr-sku').value     = v.sku || '';
    document.getElementById('vr-options').value = v.options ? (typeof v.options === 'string' ? v.options : JSON.stringify(v.options)) : '';
  } else {
    ['vr-id','vr-name','vr-price','vr-stock','vr-sku','vr-options'].forEach(i => { document.getElementById(i).value = ''; });
  }
}

async function ecVariantSave() {
  const name = document.getElementById('vr-name').value.trim();
  if (!name) { beErr('أدخل اسم المتغير'); return; }
  if (!_ecVariantProdId) { beErr('احفظ المنتج أولاً'); return; }
  const priceVal = document.getElementById('vr-price').value;
  const data = {
    id:             document.getElementById('vr-id').value || undefined,
    product_id:     _ecVariantProdId,
    name,
    price:          priceVal !== '' ? parseFloat(priceVal) : null,
    stock_quantity: parseInt(document.getElementById('vr-stock').value) || 0,
    sku:            document.getElementById('vr-sku').value.trim() || null,
    options:        document.getElementById('vr-options').value.trim() || null,
  };
  const r = await BE.ec.variants.save(data);
  if (r.id || r.ok) {
    beOk('تم حفظ المتغير');
    document.getElementById('ec-variant-form').style.display = 'none';
    await ecVariantLoadList(_ecVariantProdId);
  } else beErr(r.error || 'خطأ في الحفظ');
}

async function ecVariantDelete(id) {
  if (!confirm('هل تريد حذف هذا المتغير؟')) return;
  const r = await BE.ec.variants.delete(id);
  if (r.ok) { beOk('تم الحذف'); await ecVariantLoadList(_ecVariantProdId); }
  else beErr(r.error);
}

async function ecProdSave() {
  const id   = document.getElementById('ec-prod-id').value;
  const name = document.getElementById('ec-prod-name').value.trim();
  if (!name) { beErr('أدخل اسم المنتج'); return; }
  const price = parseFloat(document.getElementById('ec-prod-price').value);
  if (!price) { beErr('أدخل سعر المنتج'); return; }
  const imgUrl = document.getElementById('ec-prod-img').value.trim();
  const data = {
    id: id || undefined,  // include id for update; undefined for create → handler decides
    name,
    price,
    compare_price:       parseFloat(document.getElementById('ec-prod-compare').value)||null,
    stock_quantity:      parseInt(document.getElementById('ec-prod-stock').value)||0,
    low_stock_threshold: parseInt(document.getElementById('ec-prod-threshold').value)||5,
    category_id:         document.getElementById('ec-prod-cat-sel').value||null,
    is_active:           document.getElementById('ec-prod-active').checked,
    is_featured:         document.getElementById('ec-prod-featured').checked,
    description:         document.getElementById('ec-prod-desc').value.trim()||null,
    images:              imgUrl ? [{ url: imgUrl }] : [],
    tags:                document.getElementById('ec-prod-tags').value.split(',').map(t=>t.trim()).filter(Boolean),
  };
  // preload: BE.ec.products.save(data) — handler checks data.id to decide create vs update
  const r = await BE.ec.products.save(data);
  if (r.ok) { beOk(id ? 'تم تحديث المنتج' : 'تم إضافة المنتج'); closeM('m-ec-prod'); ecProdLoad(); }
  else beErr(r.error);
}

async function ecProdDelete(id, name) {
  if (!confirm(`هل تريد حذف المنتج: ${name}?`)) return;
  const r = await BE.ec.products.delete(id);
  if (r.ok) { beOk('تم حذف المنتج'); ecProdLoad(); }
  else beErr(r.error);
}

window.addEventListener('page:ec-products', () => { ecProdLoadCats(); ecProdLoad(); });
</script>
