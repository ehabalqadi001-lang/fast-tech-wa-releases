<!-- E-Commerce Shipping Zones -->
<div class="page-hd">
  <div>
    <h1 class="page-tt">🚚 مناطق الشحن</h1>
    <p class="page-st">إدارة تكاليف الشحن لكل منطقة</p>
  </div>
  <button class="btn bp" onclick="ecShipOpenForm()">+ منطقة جديدة</button>
</div>

<div class="card">
  <div id="ec-ship-table"><div class="ta ts f12 py20">جارٍ التحميل...</div></div>
</div>

<!-- Shipping Zone Form Modal -->
<div class="modal" id="m-ec-ship" style="display:none">
  <div class="modal-box" style="max-width:480px">
    <div class="modal-hd"><span id="ec-ship-form-title">منطقة شحن جديدة</span><button class="btn-x" onclick="closeM('m-ec-ship')">×</button></div>
    <div class="modal-body">
      <input type="hidden" id="ec-ship-id">
      <div style="display:grid;grid-template-columns:1fr;gap:12px">
        <div><label class="lbl">اسم المنطقة *</label><input id="ec-ship-name" class="inp w100" placeholder="القاهرة والجيزة"></div>
        <div><label class="lbl">تكلفة الشحن (ج.م) *</label><input id="ec-ship-cost" class="inp w100" type="number" min="0" step="0.5" placeholder="0"></div>
        <div><label class="lbl">شحن مجاني عند قيمة طلب تتجاوز (ج.م)</label><input id="ec-ship-free" class="inp w100" type="number" min="0" placeholder="فارغ = لا يوجد شحن مجاني"></div>
        <div><label class="lbl">أيام التسليم (الحد الأدنى)</label><input id="ec-ship-days-min" class="inp w100" type="number" min="0" placeholder="2"></div>
        <div><label class="lbl">أيام التسليم (الحد الأقصى)</label><input id="ec-ship-days-max" class="inp w100" type="number" min="0" placeholder="5"></div>
        <div><label class="lbl">المحافظات المشمولة (مفصولة بفواصل)</label><textarea id="ec-ship-govs" class="inp w100" rows="3" placeholder="القاهرة, الجيزة, 6 أكتوبر"></textarea></div>
        <div class="flex ic gap8"><input type="checkbox" id="ec-ship-active" checked><label for="ec-ship-active">منطقة نشطة</label></div>
      </div>
    </div>
    <div class="modal-ft flex gap8 jb">
      <button class="btn bo" onclick="closeM('m-ec-ship')">إلغاء</button>
      <button class="btn bp" onclick="ecShipSave()">حفظ</button>
    </div>
  </div>
</div>

<script>
let _ecShipList = [];

async function ecShipLoad() {
  if (!IS_ELECTRON) return;
  try {
    const r = await BE.ec.shipping.list();
    _ecShipList = r.data || [];
    if (!_ecShipList.length) { document.getElementById('ec-ship-table').innerHTML = '<div class="ta ts f12 py20">لا توجد مناطق شحن — أضف منطقة جديدة</div>'; return; }
    // DB fields: name, governorates (JSON array), base_fee, free_shipping_above, estimated_days_min, estimated_days_max, is_active
    document.getElementById('ec-ship-table').innerHTML = `<table class="tbl"><thead><tr><th>المنطقة</th><th>تكلفة الشحن</th><th>شحن مجاني عند</th><th>أيام التسليم</th><th>الحالة</th><th></th></tr></thead><tbody>${_ecShipList.map(z=>`<tr><td><div class="fw7">${z.name}</div><div class="f11 ts">${_govDisplay(z.governorates)}</div></td><td class="fw7">${(z.base_fee||0).toFixed(2)} ج.م</td><td class="ts f12">${z.free_shipping_above?`فوق ${z.free_shipping_above} ج.م`:'—'}</td><td class="ts f12">${z.estimated_days_min||''}${z.estimated_days_max?' - '+z.estimated_days_max:''} ${z.estimated_days_min?'يوم':''}</td><td><span class="bge f11" style="background:${z.is_active?'#10b98120':'#6b728020'};color:${z.is_active?'#10b981':'#6b7280'}">${z.is_active?'نشطة':'موقفة'}</span></td><td class="flex gap4"><button class="btn bo bsm" onclick="ecShipOpenForm('${z.id}')">تعديل</button><button class="btn bsm" style="background:#ef444420;color:#ef4444" onclick="ecShipDelete('${z.id}','${z.name.replace(/'/g,'')}')">حذف</button></td></tr>`).join('')}</tbody></table>`;
  } catch(e) { console.error('[EC-Shipping]', e); }
}

function _govDisplay(govs) {
  try {
    const arr = typeof govs === 'string' ? JSON.parse(govs) : (govs || []);
    return Array.isArray(arr) ? arr.join('، ') : String(govs||'');
  } catch(_) { return String(govs||''); }
}

function ecShipOpenForm(id) {
  if (id) {
    const z = _ecShipList.find(x => x.id === id);
    if (!z) { beErr('تعذر تحميل المنطقة'); return; }
    document.getElementById('ec-ship-form-title').textContent = 'تعديل منطقة الشحن';
    document.getElementById('ec-ship-id').value       = z.id;
    document.getElementById('ec-ship-name').value     = z.name||'';
    document.getElementById('ec-ship-cost').value     = z.base_fee||0;           // DB: base_fee
    document.getElementById('ec-ship-free').value     = z.free_shipping_above||''; // DB: free_shipping_above
    document.getElementById('ec-ship-days-min').value = z.estimated_days_min||'';  // DB: estimated_days_min
    document.getElementById('ec-ship-days-max').value = z.estimated_days_max||'';  // DB: estimated_days_max
    // DB: governorates is a JSON array string
    const govArr = (() => { try { return JSON.parse(z.governorates||'[]'); } catch(_) { return []; } })();
    document.getElementById('ec-ship-govs').value     = Array.isArray(govArr) ? govArr.join(', ') : (z.governorates||'');
    document.getElementById('ec-ship-active').checked = !!z.is_active;
  } else {
    document.getElementById('ec-ship-form-title').textContent = 'منطقة شحن جديدة';
    ['ec-ship-id','ec-ship-name','ec-ship-cost','ec-ship-free','ec-ship-days-min','ec-ship-days-max','ec-ship-govs'].forEach(i=>{ document.getElementById(i).value=''; });
    document.getElementById('ec-ship-active').checked = true;
  }
  openM('m-ec-ship');
}

async function ecShipSave() {
  const id   = document.getElementById('ec-ship-id').value;
  const name = document.getElementById('ec-ship-name').value.trim();
  if (!name) { beErr('أدخل اسم المنطقة'); return; }
  // Convert comma-separated governorates to JSON array (DB field: governorates)
  const govText = document.getElementById('ec-ship-govs').value.trim();
  const govArr  = govText ? govText.split(',').map(g=>g.trim()).filter(Boolean) : [];
  const data = {
    id:                   id || undefined,
    name,
    governorates:         JSON.stringify(govArr),    // DB: governorates (JSON array string)
    base_fee:             parseFloat(document.getElementById('ec-ship-cost').value)||0,  // DB: base_fee
    free_shipping_above:  parseFloat(document.getElementById('ec-ship-free').value)||null, // DB: free_shipping_above
    estimated_days_min:   parseInt(document.getElementById('ec-ship-days-min').value)||null, // DB: estimated_days_min
    estimated_days_max:   parseInt(document.getElementById('ec-ship-days-max').value)||null, // DB: estimated_days_max
    is_active:            document.getElementById('ec-ship-active').checked ? 1 : 0,
  };
  // preload: BE.ec.shipping.save(data) — handler checks data.id for create vs update
  const r = await BE.ec.shipping.save(data);
  if (r.ok) { beOk(id ? 'تم تحديث المنطقة' : 'تم إضافة المنطقة'); closeM('m-ec-ship'); ecShipLoad(); }
  else beErr(r.error);
}

async function ecShipDelete(id, name) {
  if (!confirm(`هل تريد حذف منطقة الشحن: ${name}?`)) return;
  const r = await BE.ec.shipping.delete(id);
  if (r.ok) { beOk('تم حذف المنطقة'); ecShipLoad(); }
  else beErr(r.error);
}

window.addEventListener('page:ec-shipping', () => ecShipLoad());
</script>
