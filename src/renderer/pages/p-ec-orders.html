<!-- E-Commerce Orders -->
<div class="page-hd">
  <div>
    <h1 class="page-tt">📦 الطلبات</h1>
    <p class="page-st" id="ec-ord-count">—</p>
  </div>
  <div class="flex gap8">
    <select id="ec-ord-status-filter" class="inp" style="width:160px" onchange="ecOrdLoad()">
      <option value="">جميع الحالات</option>
      <option value="pending">معلق</option>
      <option value="confirmed">مؤكد</option>
      <option value="processing">قيد التجهيز</option>
      <option value="shipped">تم الشحن</option>
      <option value="delivered">تم التسليم</option>
      <option value="cancelled">ملغي</option>
    </select>
    <input id="ec-ord-search" class="inp" placeholder="بحث باسم عميل أو رقم طلب..." style="width:240px" oninput="ecOrdLoad()">
  </div>
</div>

<div class="card">
  <div id="ec-ord-table">
    <div class="ta ts f12 py20">جارٍ تحميل الطلبات...</div>
  </div>
  <div class="flex jb ic mt12" id="ec-ord-pager" style="display:none!important">
    <button class="btn bo bsm" id="ec-ord-prev" onclick="ecOrdPage(-1)">السابق</button>
    <span class="f12 ts" id="ec-ord-page-info"></span>
    <button class="btn bo bsm" id="ec-ord-next" onclick="ecOrdPage(1)">التالي</button>
  </div>
</div>

<!-- Order Detail Modal -->
<div class="modal" id="m-ec-order" style="display:none">
  <div class="modal-box" style="max-width:680px">
    <div class="modal-hd"><span id="ec-ord-detail-title">تفاصيل الطلب</span><button class="btn-x" onclick="closeM('m-ec-order')">×</button></div>
    <div id="ec-ord-detail-body" class="modal-body"></div>
    <div class="modal-ft flex gap8 jb">
      <div class="flex gap8">
        <select id="ec-ord-status-sel" class="inp" style="width:160px">
          <option value="pending">معلق</option>
          <option value="confirmed">مؤكد</option>
          <option value="processing">قيد التجهيز</option>
          <option value="shipped">تم الشحن</option>
          <option value="delivered">تم التسليم</option>
          <option value="cancelled">ملغي</option>
        </select>
        <button class="btn bp" onclick="ecOrdUpdateStatus()">تحديث الحالة</button>
      </div>
      <div class="flex gap8">
        <input id="ec-ord-tracking" class="inp" placeholder="رقم التتبع..." style="width:160px">
        <button class="btn bo" onclick="ecOrdUpdateTracking()">حفظ التتبع</button>
        <button class="btn" style="background:#25d366;color:#fff" onclick="ecOrdSendWa()">📱 إرسال واتساب</button>
      </div>
    </div>
  </div>
</div>

<script>
let _ecOrdPage = 1, _ecOrdPerPage = 20, _ecOrdCurrent = null;
const EC_SL = { pending:'معلق', confirmed:'مؤكد', processing:'قيد التجهيز', shipped:'تم الشحن', delivered:'تم التسليم', cancelled:'ملغي', refunded:'مسترجع' };
const EC_SC = { pending:'#f59e0b', confirmed:'#6366f1', processing:'#3b82f6', shipped:'#8b5cf6', delivered:'#10b981', cancelled:'#ef4444', refunded:'#6b7280' };

async function ecOrdLoad() {
  if (!IS_ELECTRON) return;
  const status = document.getElementById('ec-ord-status-filter').value;
  const search = document.getElementById('ec-ord-search').value.trim();
  try {
    const r = await BE.ec.orders.list({ status: status||undefined, search: search||undefined, page: _ecOrdPage, limit: _ecOrdPerPage });
    const orders = r.data || [];
    const total  = r.total || orders.length;
    document.getElementById('ec-ord-count').textContent = `${total} طلب`;
    if (!orders.length) {
      document.getElementById('ec-ord-table').innerHTML = '<div class="ta ts f12 py20">لا توجد طلبات</div>';
      document.getElementById('ec-ord-pager').style.display = 'none';
      return;
    }
    document.getElementById('ec-ord-table').innerHTML = `<table class="tbl"><thead><tr><th>رقم الطلب</th><th>العميل</th><th>الهاتف</th><th>المبلغ</th><th>الدفع</th><th>الحالة</th><th>التاريخ</th><th></th></tr></thead><tbody>${orders.map(o=>`<tr><td class="fw7 fm">${o.order_number}</td><td>${o.customer_name||'—'}</td><td class="fm f12">${o.customer_phone||'—'}</td><td class="fw7">${(o.total_amount||0).toFixed(2)} ج.م</td><td class="f12 ts">${o.payment_method||'—'}</td><td><span class="bge f11" style="background:${EC_SC[o.status]||'#888'}20;color:${EC_SC[o.status]||'#888'}">${EC_SL[o.status]||o.status}</span></td><td class="f11 ts">${new Date(o.created_at).toLocaleDateString('ar')}</td><td><button class="btn bo bsm" onclick="ecOrdersOpenDetail('${o.id}')">عرض</button></td></tr>`).join('')}</tbody></table>`;
    const pages = Math.ceil(total / _ecOrdPerPage);
    if (pages > 1) {
      document.getElementById('ec-ord-pager').style.display = 'flex';
      document.getElementById('ec-ord-page-info').textContent = `صفحة ${_ecOrdPage} من ${pages}`;
      document.getElementById('ec-ord-prev').disabled = _ecOrdPage <= 1;
      document.getElementById('ec-ord-next').disabled = _ecOrdPage >= pages;
    } else {
      document.getElementById('ec-ord-pager').style.display = 'none';
    }
    // Auto-open if navigated from dashboard
    if (window._ecViewOrderId) { const id = window._ecViewOrderId; window._ecViewOrderId = null; ecOrdersOpenDetail(id); }
  } catch(e) { console.error('[EC-Orders]', e); }
}

function ecOrdPage(d) { _ecOrdPage = Math.max(1, _ecOrdPage + d); ecOrdLoad(); }

async function ecOrdersOpenDetail(id) {
  if (!IS_ELECTRON) return;
  window.ecOrdersOpenDetail = ecOrdersOpenDetail;
  try {
    const r = await BE.ec.orders.get(id);
    if (!r.ok) { beErr(r.error); return; }
    const o = r.data;
    _ecOrdCurrent = o;
    document.getElementById('ec-ord-detail-title').textContent = `طلب رقم: ${o.order_number}`;
    document.getElementById('ec-ord-status-sel').value = o.status;
    document.getElementById('ec-ord-tracking').value = o.tracking_number||'';
    const items = JSON.parse(o.items_json||'[]');
    const addr  = JSON.parse(o.delivery_address||'{}');
    document.getElementById('ec-ord-detail-body').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
        <div><div class="f11 ts mb4">العميل</div><div class="fw7">${o.customer_name||'—'}</div><div class="f12 ts">${o.customer_phone||''}</div></div>
        <div><div class="f11 ts mb4">التاريخ</div><div>${new Date(o.created_at).toLocaleString('ar')}</div></div>
        <div><div class="f11 ts mb4">طريقة الدفع</div><div>${o.payment_method||'—'}</div></div>
        <div><div class="f11 ts mb4">منطقة الشحن</div><div>${o.shipping_zone||'—'}</div></div>
        ${addr.street ? `<div class="span2"><div class="f11 ts mb4">العنوان</div><div>${addr.street||''} ${addr.city||''} ${addr.area||''}</div></div>` : ''}
        ${o.delivery_notes ? `<div class="span2"><div class="f11 ts mb4">ملاحظات التسليم</div><div>${o.delivery_notes}</div></div>` : ''}
      </div>
      <div class="fw7 mb8">المنتجات</div>
      <table class="tbl mb12"><thead><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>المجموع</th></tr></thead><tbody>
        ${items.map(i=>`<tr><td>${i.name||i.product_id}</td><td>${i.quantity}</td><td>${(i.unit_price||0).toFixed(2)}</td><td>${((i.unit_price||0)*(i.quantity||1)).toFixed(2)}</td></tr>`).join('')}
      </tbody></table>
      <div class="flex jb"><span class="ts">المجموع الفرعي</span><span>${(o.subtotal||0).toFixed(2)} ج.م</span></div>
      ${o.discount_amount ? `<div class="flex jb"><span class="ts">الخصم</span><span class="fc-r">- ${(o.discount_amount||0).toFixed(2)} ج.م</span></div>` : ''}
      ${o.shipping_cost ? `<div class="flex jb"><span class="ts">الشحن</span><span>${(o.shipping_cost||0).toFixed(2)} ج.م</span></div>` : ''}
      <div class="flex jb fw7 mt8"><span>الإجمالي</span><span>${(o.total_amount||0).toFixed(2)} ج.م</span></div>
      ${o.tracking_number ? `<div class="mt8 ts f12">رقم التتبع: <span class="fm fw7">${o.tracking_number}</span></div>` : ''}
    `;
    openM('m-ec-order');
  } catch(e) { beErr(e.message); }
}

async function ecOrdUpdateStatus() {
  if (!_ecOrdCurrent) return;
  const status = document.getElementById('ec-ord-status-sel').value;
  const r = await BE.ec.orders.updateStatus(_ecOrdCurrent.id, status);
  if (r.ok) { beOk('تم تحديث حالة الطلب'); closeM('m-ec-order'); ecOrdLoad(); }
  else beErr(r.error);
}

async function ecOrdUpdateTracking() {
  if (!_ecOrdCurrent) return;
  const tracking = document.getElementById('ec-ord-tracking').value.trim();
  const r = await BE.ec.orders.updateTracking(_ecOrdCurrent.id, tracking);
  if (r.ok) { beOk('تم حفظ رقم التتبع'); }
  else beErr(r.error);
}

async function ecOrdSendWa() {
  if (!_ecOrdCurrent) return;
  const r = await BE.ec.orders.triggerWaConfirmation(_ecOrdCurrent.id);
  if (r.ok) { beOk('تم إرسال رسالة التأكيد عبر واتساب'); closeM('m-ec-order'); }
  else beErr(r.error || 'تعذر إرسال رسالة واتساب');
}

window.ecOrdersOpenDetail = ecOrdersOpenDetail;
window.addEventListener('page:ec-orders', () => { _ecOrdPage = 1; ecOrdLoad(); });
</script>
